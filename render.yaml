services:
  - type: web
    name: woolly-run
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: SITE_URL, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: ADMIN_EMAILS, sync: false }
