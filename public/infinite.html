function noise(d,v=.1,fc=800){const a=au();if(!a||mute)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const sr=a.createBufferSource();sr.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;const gn=a.createGain();gn.gain.setValueAtTime(v,a.currentTime);gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);sr.connect(f);f.connect(gn);gn.connect(a.destination);sr.start()}

function DIST(){return Math.max(0,Math.floor(P.x/10))}
function infScore(){return DIST()+S.clv*10}
function infSpeed(){return 90*(1+Math.min(8,Math.floor(infScore()/250))*.1)}

function endInf(){engine(40,0);SFX.lose();const sc=infScore(),dm=DIST();const top=lbGet();const q=sc>0&&(top.length<10||sc>top[top.length-1].s);

  $('ov').innerHTML=`<div><h2>∞ Run over</h2><p>Distance <b>${dm} m</b> · Clovers ${S.clv}<br>Score <b>${sc}</b>${q?'<br>🏆 You made the TOP 10! Your name:<br><input id="nm" maxlength="12" value="'+lbName().replace(/"/g,'')+'" style="margin-top:6px;padding:8px;border-radius:8px;border:0;text-align:center;font-size:15px;width:70%">':''}</p><div>${lbHtml(top.slice(0,5),-1)}</div><div id="wlb" style="font-size:12px;margin:6px 0;text-align:left"></div><button class="b b2" id="sv">${q?'Save score & retry':'Retry'}</button><button class="b b3" onclick="location.href='index.html'">Level Select</button></div>`;
  if(window.WR)WR.afterRun(sc,dm,S.clv,S.t);

function hudInf(){const sc=infScore(),b=(lbGet()[0]||{s:0}).s;g.textAlign='center';g.font='800 22px system-ui';g.lineWidth=4;g.strokeStyle='#000a';g.strokeText(sc+' pts',W/2,64);g.fillStyle='#fff';g.fillText(sc+' pts',W/2,64);g.font='700 11px system-ui';g.fillStyle='#ffd43b';g.fillText(DIST()+' m · SPEED ×'+(infSpeed()/90).toFixed(1)+' · TOP '+Math.max(b,sc),W/2,80);
 const near=P.x-cam;if(near<130){const a=(130-near)/130,gr=g.createLinearGradient(0,0,110,0);gr.addColorStop(0,'rgba(255,40,40,'+(.6*a)+')');gr.addColorStop(1,'rgba(255,40,40,0)');g.fillStyle=gr;g.fillRect(0,0,110,H)}

function mkP(x,y,w,t,ax,ay,sp,by){return{x,y,w,h:y>=380?70:16,t:t||'s',ax:ax||0,ay:ay||0,sp:sp||0,by:by||y,ox:x,dx:0,dy:0,tm:0,fall:0,rt:0}}
function tickInf(dt){const sc=infScore(),k=Math.min(8,Math.floor(sc/250));if(MSG.t>0)MSG.t-=dt;
 if(k>IK){IK=k;MSG={t:1.8,s:'⚡ SPEED UP ×'+(1+k*.1).toFixed(1)+' ⚡'};SFX.power();sh=6}
 cam=Math.max(cam+infSpeed()*dt,P.x-W*.6);
 if(P.x<cam+18){P.x=cam+44;hurt()}
 const D=Math.min(1,sc/1800);let guard=0;while(GX<cam+W*1.8&&guard++<12)chunkInf(D);

function chunkInf(D){const r=Math.random,gap=()=>Math.round(56+D*40+r()*16);
 let k=['ground','ground','crumble','moving','vmove','island','crumble','moving'][Math.floor(r()*8)];

 else if(k==='vmove'){const ay=Math.round(70+D*25);PL.push(mkP(x,300,84,'m',0,ay,+(1.2+D*.4).toFixed(2),300));GX=x+84;GY=300}
 else{const y=GY>=380?340:GY,w=Math.round(100-D*25);PL.push(mkP(x,y,w));JT.push({x:Math.round(x+w/2),y,o:r()*2.5});coin(x,y,w);GX=x+w;GY=y}}
