<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheep – Level 2: Fire Rush</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4efe4;--fg:#2a2118;--card:#fff;--lane:#e6dcc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--fg:#f4efe4;--card:#2a221b;--lane:#3a2f25}}
:root[data-theme="dark"]{--bg:#1a1511;--fg:#f4efe4;--card:#2a221b;--lane:#3a2f25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding-bottom:12px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:15px;margin:10px 0 6px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
#target{display:flex;align-items:center;gap:12px;background:var(--card);padding:8px 16px;border-radius:14px;box-shadow:0 2px 8px #0003}
#sw{width:44px;height:44px;border-radius:10px;border:3px solid var(--fg)}
#tn{font-size:22px;font-weight:800;min-width:90px}
#bar{width:min(92vw,400px);height:8px;background:var(--lane);border-radius:4px;margin:8px 0;overflow:hidden}
#bf{height:100%;width:100%;background:#e8590c}
#wrap{position:relative;width:min(92vw,400px);--rh:clamp(22px,calc((100vh - 210px)/13.5),44px);height:calc(var(--rh)*13.5);background:var(--lane);border-radius:12px;overflow:hidden}
#grid{position:absolute;left:34px;right:6px;top:0;height:calc(var(--rh)*12);display:grid;grid-template-rows:repeat(12,1fr);gap:0}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:2px 0;opacity:.35;transition:opacity .2s}
.row.cur{opacity:1}.row.done{opacity:.12}
.t{border:0;border-radius:6px;cursor:pointer;box-shadow:inset 0 -3px #0003}
.row:not(.cur) .t{pointer-events:none}
.t:active{transform:scale(.92)}
#fire{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#b02a0b,#e8590c 60%,#ffb020);box-shadow:0 -8px 18px #ff7a00aa}
#fire:before{content:"🔥🔥🔥🔥🔥🔥🔥🔥";position:absolute;top:-22px;left:0;right:0;font-size:22px;white-space:nowrap;overflow:hidden;text-align:center}
#sheep{position:absolute;left:4px;z-index:3;font-size:26px;transition:bottom .15s,left .15s;filter:drop-shadow(0 2px 2px #0006);line-height:1}
#ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#ov div{background:var(--card);padding:22px;border-radius:16px;max-width:340px;text-align:center}
#ov h2{margin:0 0 8px}#ov p{margin:0 0 14px;line-height:1.4;font-size:14px}
button.go{background:#e8590c;color:#fff;border:0;padding:12px 28px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#info{font-size:13px;opacity:.7;margin-top:8px}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1b1f4f">
</head><body>
<script src="/js/ads.js"></script>
<script src="/config.js"></script>
<script src="/js/wr.js" defer></script>



<h1>Level 2 · Fire Rush</h1>
<div id="target"><div id="sw"></div><div id="tn"></div></div>
<div id="bar"><div id="bf"></div></div>
<div id="wrap"><div id="grid"></div><div id="fire"></div><div id="sheep">🐑</div></div>
<div id="info">Row <span id="rn">1</span> / 12</div>
<div id="ov"><div><h2>🔥 Level 2</h2><p>Tap the tile matching the target color in your row. The target changes every 2 seconds. Wrong tap, or let the fire catch your sheep, and it's over. Clear all 12 rows!</p><button class="go" id="gb">Start</button></div></div>
<script>
const C=[["Red","#e03131"],["Blue","#1c7ed6"],["Green","#2f9e44"],["Yellow","#fcc419"],["Purple","#9c36b5"],["Orange","#f76707"]];
const $=id=>document.getElementById(id);
let stand=null,rows,row,target,tLeft,fire,state,last,rowEls;
const RH=()=>$('wrap').clientHeight/13.5;
function build(){
  $('grid').innerHTML='';rowEls=[];
  for(let i=11;i>=0;i--){ // top = row 11
    const r=document.createElement('div');r.className='row';
    const order=[...C.keys()].sort(()=>Math.random()-.5);
    order.forEach(ci=>{const b=document.createElement('button');b.className='t';b.style.background=C[ci][1];b.setAttribute('aria-label',C[ci][0]);b.onpointerdown=e=>{e.preventDefault();tap(i,ci,b)};r.appendChild(b)});
    $('grid').appendChild(r);rowEls[i]=r;
  }
}
function newTarget(){let n;do{n=Math.floor(Math.random()*6)}while(n===target);target=n;tLeft=2;
  $('sw').style.background=C[n][1];$('tn').textContent=C[n][0].toUpperCase();}
function start(){
  build();stand=null;row=0;target=-1;fire=-1.3;state='play';last=performance.now();
  rowEls[0].classList.add('cur');newTarget();$('ov').style.display='none';upd();requestAnimationFrame(loop);
}
function end(win){state='over';
  $('ov').innerHTML=`<div><h2>${win?'🐑 Escaped!':'🔥 Burned!'}</h2><p>${win?'You cleared all 12 rows before the fire caught you. Impressive!':'Too slow or the wrong color. The fire is fast — try again!'}</p><button class="go" id="gb">${win?'Play again':'Retry'}</button></div>`;
  (win?(f=>f()):AD.full)(()=>{$('ov').style.display='flex'});$('gb').onclick=start;}
function tap(r,ci,b){
  if(state!=='play'||r!==row)return;
  if(ci!==target){end(false);return}
  stand=b;rowEls[row].classList.remove('cur');rowEls[row].classList.add('done');row++;
  if(row>11){upd();end(true);return}
  rowEls[row].classList.add('cur');newTarget();upd();
}
function upd(){
  $('rn').textContent=Math.min(row+1,12);
  const sh=$('sheep');
  if(stand){const w=$('wrap').getBoundingClientRect(),r=stand.getBoundingClientRect();
    sh.style.left=(r.left-w.left+r.width/2-13)+'px';sh.style.bottom=(w.bottom-r.bottom+r.height*.45)+'px';}
  else{sh.style.left='4px';sh.style.bottom=(1.5*RH()+RH()*.5-13)+'px';}
}
function loop(t){
  if(state!=='play')return;
  const dt=Math.min((t-last)/1000,.1);last=t;
  fire+=(0.30+0.02*row)*dt;
  tLeft-=dt;if(tLeft<=0)newTarget();
  $('bf').style.width=(tLeft/2*100)+'%';
  $('fire').style.height=Math.max(0,(fire+1.5)*RH())+'px';
  if(fire>=(row>0?row-1:0)+0.2){end(false);return}
  requestAnimationFrame(loop);
}
$('gb').onclick=start;
addEventListener('resize',upd);upd();
</script></body></html>
