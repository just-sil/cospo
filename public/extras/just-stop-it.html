<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Stop It – Easy? Not really.</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ff;--fg:#241b3d;--card:#fff;--lane:#ddd5f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--fg:#f1edff;--card:#241d44;--lane:#352d5e}}
:root[data-theme="dark"]{--bg:#15112a;--fg:#f1edff;--card:#241d44;--lane:#352d5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:15px;margin:6px 0;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.stats{display:flex;gap:10px;width:min(94vw,420px);margin:8px 0 28px}
.stats div{flex:1;background:var(--card);border-radius:12px;padding:8px;text-align:center;font-size:12px}
.stats b{display:block;font-size:26px}
#lane{position:relative;width:min(94vw,420px);height:56px;background:var(--lane);border-radius:28px;overflow:hidden}
#zone{position:absolute;top:0;bottom:0;background:#37b24d;opacity:.9}
#mk{position:absolute;top:4px;bottom:4px;width:8px;margin-left:-4px;border-radius:4px;background:var(--fg)}
#msg{height:30px;margin:16px 0;font-size:18px;font-weight:800;text-align:center}
#tap{width:min(94vw,420px);flex:1;min-height:150px;max-height:260px;border:0;border-radius:22px;background:#7048e8;color:#fff;font-size:34px;font-weight:900;box-shadow:inset 0 -8px #0003;cursor:pointer}
#tap:active{transform:scale(.97)}
#ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#ov div{background:var(--card);padding:22px;border-radius:16px;max-width:340px;text-align:center}
#ov h2{margin:0 0 8px}#ov p{margin:0 0 14px;line-height:1.4;font-size:14px}
.go{background:#7048e8;color:#fff;border:0;padding:12px 28px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1b1f4f">
</head><body>
<script src="/js/ads.js"></script>
<script src="/config.js"></script>
<script src="/js/wr.js" defer></script>



<h1>Just Stop It</h1>
<div class="stats"><div><b id="sc">0</b>streak</div><div><b id="bs">0</b>best</div></div>
<div id="lane"><div id="zone"></div><div id="mk"></div></div>
<div id="msg">Stop the line inside the green</div>
<button id="tap">STOP</button>
<div id="ov"><div><h2>🎯 Just Stop It</h2><p>Tap to stop the moving line inside the green zone. Sounds easy... but the zone shrinks and the line speeds up every hit. One miss and it's over.</p><button class="go" id="gb">Start</button></div></div>
<script>
const $=id=>document.getElementById(id);
let p,dir,speed,zw,zx,score,best=0,state,last,drift,dd;
try{best=+localStorage.getItem('jsi')||0}catch(e){}
$('bs').textContent=best;
function setZone(){
  zw=Math.max(.025,.30*Math.pow(.9,score));
  const lo=.04,hi=.96-zw;
  zx=lo+Math.random()*(hi-lo);
  drift=score>=8?(Math.random()<.5?-1:1)*Math.min(.12,.02*(score-6)):0;
  speed=.55+score*.07;
}
function start(){score=0;p=0;dir=1;dd=1;setZone();state='play';last=performance.now();$('ov').style.display='none';$('msg').textContent='Stop the line inside the green';draw();requestAnimationFrame(loop)}
function end(){state='over';
  if(score>best){best=score;try{localStorage.setItem('jsi',best)}catch(e){}}
  $('bs').textContent=best;
  $('ov').innerHTML=`<div><h2>${score>=15?'🏆':'💥'} Streak: ${score}</h2><p>${score<5?'Easy, right? It gets nastier...':score<12?'Nice! Can you beat '+Math.max(best,score)+'?':'Insane reflexes!'}</p><button class="go" id="gb">Try again</button></div>`;
  AD.full(()=>{$('ov').style.display='flex'});$('gb').onclick=start}
$('tap').onpointerdown=e=>{e.preventDefault();
  if(state!=='play')return;
  const hit=p>=zx&&p<=zx+zw;
  if(!hit){end();return}
  score++;$('sc').textContent=score;
  const c=Math.abs(p-(zx+zw/2))<zw*.15;
  $('msg').textContent=c?'PERFECT!':'Hit!';
  setZone();
};
function draw(){
  $('mk').style.left=(p*100)+'%';
  $('zone').style.left=(zx*100)+'%';$('zone').style.width=(zw*100)+'%';
  $('sc').textContent=score;
}
function loop(n){
  if(state!=='play')return;
  const dt=Math.min((n-last)/1000,.05);last=n;
  p+=dir*speed*dt;
  if(p>=1){p=1;dir=-1}else if(p<=0){p=0;dir=1}
  if(drift){zx+=drift*dd*dt;if(zx<.02){zx=.02;dd=1}else if(zx+zw>.98){zx=.98-zw;dd=-1}}
  draw();requestAnimationFrame(loop);
}
$('gb').onclick=start;
</script></body></html>
