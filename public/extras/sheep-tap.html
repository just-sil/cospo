<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheep Dash – Tap Game</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9f5df;--fg:#22301a;--card:#fff;--lane:#cfe6b8;--sky:#bfe3f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15200f;--fg:#eaf5df;--card:#223018;--lane:#2f4421;--sky:#1d3345}}
:root[data-theme="dark"]{--bg:#15200f;--fg:#eaf5df;--card:#223018;--lane:#2f4421;--sky:#1d3345}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px 14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:15px;margin:4px 0 10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.stats{display:flex;gap:10px;width:min(94vw,420px);margin-bottom:10px}
.stats div{flex:1;background:var(--card);border-radius:12px;padding:8px;text-align:center;font-size:12px;opacity:.95}
.stats b{display:block;font-size:22px}
#track{position:relative;width:min(94vw,420px);height:110px;background:linear-gradient(var(--sky) 55%,var(--lane) 55%);border-radius:14px;overflow:hidden}
#sheep{position:absolute;bottom:14px;left:0;font-size:44px;line-height:1;transition:left .08s linear}
#sheep.hop{animation:hop .18s}
@keyframes hop{50%{transform:translateY(-14px)}}
#flag{position:absolute;right:8px;bottom:14px;font-size:34px}
.lbl{width:min(94vw,420px);font-size:12px;margin:12px 0 4px;display:flex;justify-content:space-between;opacity:.8}
.bar{width:min(94vw,420px);height:16px;background:var(--lane);border-radius:8px;overflow:hidden}
#fb{height:100%;width:0;background:#51cf66}
#tap{margin-top:18px;width:min(94vw,420px);flex:1;min-height:150px;max-height:260px;border:0;border-radius:22px;background:#2f9e44;color:#fff;font-size:34px;font-weight:900;box-shadow:inset 0 -8px #0003;cursor:pointer}
#tap:active{transform:scale(.97)}
#tap.tired{background:#868e96}
#ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#ov div{background:var(--card);padding:22px;border-radius:16px;max-width:340px;text-align:center}
#ov h2{margin:0 0 8px}#ov p{margin:0 0 14px;line-height:1.4;font-size:14px}
.go{background:#2f9e44;color:#fff;border:0;padding:12px 28px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1b1f4f">
</head><body>
<script src="/js/ads.js"></script>
<script src="/config.js"></script>
<script src="/js/wr.js" defer></script>



<h1>Level 1 · Sheep Dash</h1>
<div class="stats"><div><b id="tm">25</b>seconds</div><div><b id="ds">0</b>/ 100 m</div></div>
<div id="track"><div id="sheep">🐑</div><div id="flag">🏁</div></div>
<div class="lbl"><span>Fatigue</span><span id="ft">Go!</span></div>
<div class="bar"><div id="fb"></div></div>
<button id="tap">TAP!</button>
<div id="ov"><div><h2>🐑 Level 1</h2><p>Tap fast to make the sheep run to the flag in 25 seconds. Tapping tires the sheep: if fatigue maxes out, it must rest before it can run again. Pace yourself!</p><button class="go" id="gb">Start</button></div></div>
<script>
const $=id=>document.getElementById(id);
const GOAL=100,TIME=25,STEP=2,COST=9,REC=13,LOCK=100,UNLOCK=35;
let d,t,f,tired,state,last;
function start(){d=0;t=TIME;f=0;tired=false;state='play';last=performance.now();$('ov').style.display='none';draw();requestAnimationFrame(loop)}
function end(win){state='over';
  $('ov').innerHTML=`<div><h2>${win?'🏁 You made it!':'⏱ Time\'s up!'}</h2><p>${win?'The sheep crossed the line with '+t.toFixed(1)+'s left.':'The sheep got to '+Math.floor(d)+' m. Rest at the right moments!'}</p><button class="go" id="gb">${win?'Play again':'Retry'}</button></div>`;
  (win?(f=>f()):AD.full)(()=>{$('ov').style.display='flex'});$('gb').onclick=start}
$('tap').onpointerdown=e=>{e.preventDefault();
  if(state!=='play'||tired)return;
  d=Math.min(GOAL,d+STEP);f+=COST;
  const s=$('sheep');s.classList.remove('hop');void s.offsetWidth;s.classList.add('hop');
  if(f>=LOCK){f=LOCK;tired=true}
  draw();if(d>=GOAL)end(true)};
function draw(){
  const w=$('track').clientWidth-60;
  $('sheep').style.left=(d/GOAL*w)+'px';
  $('ds').textContent=Math.floor(d);$('tm').textContent=Math.ceil(t);
  $('fb').style.width=f+'%';$('fb').style.background=f>70?'#e03131':f>40?'#fcc419':'#51cf66';
  $('tap').classList.toggle('tired',tired);$('tap').textContent=tired?'RESTING…':'TAP!';
  $('ft').textContent=tired?'Exhausted – wait!':f>70?'Tiring!':'Go!';
}
function loop(n){
  if(state!=='play')return;
  const dt=Math.min((n-last)/1000,.1);last=n;
  t-=dt;f=Math.max(0,f-REC*dt);
  if(tired&&f<=UNLOCK)tired=false;
  draw();
  if(t<=0){t=0;draw();end(false);return}
  requestAnimationFrame(loop);
}
$('gb').onclick=start;
</script></body></html>
