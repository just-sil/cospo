<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#1b1f4f"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/site.css"><title>Admin · Woolly Run</title></head><body>
<div class="wrap wide">
 <div class="top"><div style="display:flex;align-items:center;gap:12px"><img class="logo" src="/assets/logo.svg" alt="Woolly Run"><b style="font-size:20px">Admin</b></div><div class="nav"><a class="chip" href="/">View game</a><button class="chip" id="out" style="display:none">Log out</button></div></div>
 <div id="login" class="card" style="max-width:420px;margin:30px auto;display:none"><h2>Admin sign-in</h2>
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div id="lmsg" class="msg" role="alert"></div><button class="btn pri" id="go" style="margin-top:12px">Sign in</button>
  <div class="muted" style="margin-top:10px">Signed in with Google/Facebook? Just <a href="/login.html?next=/admin">log in here</a>.</div></div>
 <div id="app" style="display:none">
  <div class="side" id="side"><button data-t="dash" class="on">📊 Dashboard</button><button data-t="users">👥 Users</button><button data-t="ads">💰 Ads &amp; revenue</button><button data-t="scores">🏆 Scores</button></div>
  <div id="pane"></div>
 </div>
</div>
<script src="/config.js"></script><script src="/js/wr.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},E=WR.esc,tab='dash',page=1,q='',me=null;
function money(n){return '$'+(+n||0).toFixed(2)}function num(n){return (+n||0).toLocaleString()}
function toast(t,ok){var d=document.createElement('div');d.className='msg '+(ok?'ok':'err');d.style.cssText='position:fixed;right:14px;bottom:14px;z-index:99;max-width:320px';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3500)}
function fail(e){toast(e.message||'Error')}
function bars(cv,labels,sets,colors){var c=cv.getContext('2d'),dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;c.scale(dpr,dpr);c.clearRect(0,0,w,h);
 var n=labels.length,max=1;for(var i=0;i<n;i++){var t=0;sets.forEach(function(s){t+=s[i]||0});max=Math.max(max,t)}
 var bw=(w-40)/n;c.fillStyle='#a9b0d0';c.font='10px system-ui';c.fillText(num(Math.ceil(max)),2,12);
 for(var i=0;i<n;i++){var y=h-18;sets.forEach(function(s,k){var v=(s[i]||0)/max*(h-34);c.fillStyle=colors[k];c.fillRect(34+i*bw+1,y-v,Math.max(1,bw-2),v);y-=v});if(i%5===0||i===n-1){c.fillStyle='#a9b0d0';c.fillText(labels[i].slice(5),34+i*bw,h-4)}}}
function auth(){WR.me(true).then(function(p){if(!p){$('login').style.display='block';$('app').style.display='none';return}
  return WR.api('/me').then(function(r){me=r.user;if(me.role!=='admin'){$('login').style.display='block';$('app').style.display='none';$('lmsg').className='msg err';$('lmsg').textContent='This account is not an admin.';return}
   $('login').style.display='none';$('app').style.display='block';$('out').style.display='inline-flex';render()})}).catch(function(e){$('login').style.display='block';$('lmsg').className='msg err';$('lmsg').textContent=e.message})}
$('go').onclick=function(){WR.sb().then(function(sb){return sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value})}).then(function(r){if(r.error){$('lmsg').className='msg err';$('lmsg').textContent=r.error.message;return}auth()}).catch(function(e){$('lmsg').className='msg err';$('lmsg').textContent=e.message})};
$('out').onclick=function(){WR.signOut().then(function(){location.reload()})};
$('side').onclick=function(e){var b=e.target.closest('button');if(!b)return;tab=b.dataset.t;Array.prototype.forEach.call($('side').children,function(x){x.className=x===b?'on':''});render()};
function render(){$('pane').innerHTML='<div class="card"><span class="spin"></span></div>';({dash:dash,users:users,ads:ads,scores:scores})[tab]()}
function dash(){WR.api('/admin/stats').then(function(s){var a=s.ads,u=s.users,ser=a.series;
 var card=function(t,v,sub){return '<div class="stat"><b>'+v+'</b><span>'+t+(sub?' · '+sub:'')+'</span></div>'};
 $('pane').innerHTML='<div class="grid">'+card('Players',num(u.total),'+'+u.new7+' this week')+card('Active (24h)',num(u.active24))+card('Banned',num(u.banned))+card('Scores stored',num(s.scores))+'</div>'+
 '<h2 style="margin:18px 0 8px">Ads</h2><div class="grid">'+card('Today · est. revenue',money(a.today.est),num(a.today.imp)+' impressions')+card('7 days · est.',money(a.week.est),num(a.week.imp)+' imp · '+num(a.week.clk)+' clicks')+card('30 days · est.',money(a.month.est),num(a.month.imp)+' imp')+card('30 days · reported',money(a.month.rep),'entered by you')+'</div>'+
 '<div class="card" style="margin-top:14px"><h2>Impressions per day <span class="muted">(blue banner · orange interstitial)</span></h2><canvas class="ch" id="c1"></canvas></div>'+
 '<div class="card"><h2>Revenue per day <span class="muted">(green estimated · gold reported)</span></h2><canvas class="ch" id="c2"></canvas></div>'+
 '<div class="grid"><div class="card"><h2>Top countries (players)</h2>'+(u.byCountry.map(function(r){return '<div style="padding:4px 0">'+WR.flag(r[0])+' '+E(r[0]==='??'?'Unknown':WR.cname(r[0]))+' <b style="float:right">'+r[1]+'</b></div>'}).join('')||'<span class="muted">No players yet</span>')+'</div>'+
 '<div class="card"><h2>Top scores</h2>'+(s.top.map(function(r,i){return '<div style="padding:4px 0">'+(i+1)+'. '+WR.flag(r.country)+' '+E(r.name)+' <b style="float:right">'+r.score+'</b></div>'}).join('')||'<span class="muted">No scores yet</span>')+'</div></div>';
 var L=ser.map(function(d){return d.date});bars($('c1'),L,[ser.map(function(d){return d.bannerImp}),ser.map(function(d){return d.intImp})],['#4dabf7','#ff922b']);
 bars($('c2'),L,[ser.map(function(d){return d.estRevenue}),ser.map(function(d){return d.reported})],['#51cf66','#ffd43b'])}).catch(fail)}
function users(){WR.api('/admin/users?page='+page+'&q='+encodeURIComponent(q)).then(function(r){
 $('pane').innerHTML='<div class="card"><div class="row"><div><label>Search name, e-mail or country code</label><input id="sq" value="'+E(q)+'" placeholder="alice@…"></div><button class="btn pri" id="sgo" style="flex:0 0 120px">Search</button></div></div><div class="card tbl"><table><tr><th>Player</th><th>E-mail</th><th>Country</th><th>Best</th><th>Status</th><th>Joined</th><th>Last seen</th><th></th></tr>'+
 r.users.map(function(u){var self=me&&u.id===me.id;return '<tr><td><b>'+E(u.name)+'</b></td><td>'+E(u.email||'')+'</td><td>'+WR.flag(u.country)+' '+E(u.country||'–')+'</td><td>'+num(u.best_score)+'</td><td>'+(u.role==='admin'?'<span class="tag admin">admin</span> ':'')+(u.banned?'<span class="tag ban">banned</span>':'')+'</td><td>'+new Date(u.created_at).toLocaleDateString()+'</td><td>'+new Date(u.last_seen).toLocaleDateString()+'</td><td>'+(self?'<span class="muted">you</span>':'<button class="btn sm" data-a="ban" data-id="'+u.id+'" data-v="'+(!u.banned)+'">'+(u.banned?'Unban':'Ban')+'</button> <button class="btn sm" data-a="role" data-id="'+u.id+'" data-v="'+(u.role==='admin'?'user':'admin')+'">'+(u.role==='admin'?'Remove admin':'Make admin')+'</button> <button class="btn sm red" data-a="del" data-id="'+u.id+'">Delete</button>')+'</td></tr>'}).join('')+
 '</table></div><div class="row"><button class="btn sm" id="pp" '+(page<2?'disabled':'')+'>← Prev</button><span class="muted" style="text-align:center">Page '+page+' · '+num(r.total)+' players</span><button class="btn sm" id="pn" '+(page*25>=r.total?'disabled':'')+'>Next →</button></div>';
 $('sgo').onclick=function(){q=$('sq').value.trim();page=1;users()};$('sq').onkeydown=function(e){if(e.key==='Enter')$('sgo').click()};$('pp').onclick=function(){page--;users()};$('pn').onclick=function(){page++;users()};
 $('pane').onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;var id=b.dataset.id,a=b.dataset.a;
  if(a==='del'){if(!confirm('Permanently delete this player and their scores?'))return;WR.api('/admin/users/'+id,{method:'DELETE'}).then(function(){toast('Deleted',1);users()}).catch(fail)}
  else{var body=a==='ban'?{banned:b.dataset.v==='true'}:{role:b.dataset.v};if(a==='ban'&&body.banned&&!confirm('Suspend this player?'))return;WR.api('/admin/users/'+id,{method:'PATCH',body:body}).then(function(){toast('Updated',1);users()}).catch(fail)}}}).catch(fail)}
function ads(){WR.api('/admin/ads').then(function(r){var c=r.config,today=new Date().toISOString().slice(0,10),sw=function(id,v,t){return '<label class="switch"><input type="checkbox" id="'+id+'" '+(v?'checked':'')+'> '+t+'</label>'};
 $('pane').innerHTML='<div class="card"><h2>Ad settings <span class="muted">(applies to every game page within ~15 s)</span></h2>'+sw('a-on',c.enabled,'Ads enabled globally')+
  '<div class="row" style="margin-top:8px"><div>'+sw('b-on',c.banner.enabled,'Top banner')+'<label>Meta banner placement ID</label><input id="b-id" value="'+E(c.banner.placementId)+'" placeholder="123456789_987654321"></div><div>'+sw('i-on',c.interstitial.enabled,'Game-over full-screen ad')+'<label>Meta interstitial placement ID</label><input id="i-id" value="'+E(c.interstitial.placementId)+'"></div></div>'+
  '<div class="row"><div><label>Min seconds between full-screen ads (0 = every game over)</label><input id="i-gap" type="number" min="0" value="'+c.interstitial.minGapSec+'"></div><div><label>eCPM banner (USD per 1000 impressions)</label><input id="e-b" type="number" step="0.01" min="0" value="'+c.ecpm.banner+'"></div><div><label>eCPM interstitial (USD)</label><input id="e-i" type="number" step="0.01" min="0" value="'+c.ecpm.interstitial+'"></div></div>'+
  '<button class="btn pri" id="a-save" style="margin-top:12px;max-width:220px">Save settings</button></div>'+
  '<div class="card"><h2>Add real revenue <span class="muted">(copy from Meta Monetization Manager)</span></h2><div class="row"><div><label>Date</label><input id="r-d" type="date" value="'+today+'"></div><div><label>Network</label><input id="r-n" value="meta"></div><div><label>Placement</label><select id="r-p"><option>all</option><option>banner</option><option>interstitial</option></select></div><div><label>Amount (USD)</label><input id="r-a" type="number" step="0.01" min="0"></div><div><label>Impressions</label><input id="r-i" type="number" min="0"></div><div><label>Note</label><input id="r-t" maxlength="80"></div></div><button class="btn green" id="r-add" style="margin-top:12px;max-width:200px">Add entry</button> <button class="btn sm" id="csv" style="margin-left:8px">⬇ Export CSV (90 days)</button></div>'+
  '<div class="card tbl"><h2>Revenue entries</h2><table><tr><th>Date</th><th>Network</th><th>Placement</th><th>Amount</th><th>Impressions</th><th>Note</th><th></th></tr>'+(r.revenue.map(function(x){return '<tr><td>'+x.date+'</td><td>'+E(x.network)+'</td><td>'+E(x.placement)+'</td><td>'+money(x.amount)+'</td><td>'+num(x.impressions)+'</td><td>'+E(x.note||'')+'</td><td><button class="btn sm red" data-del="'+x.id+'">Delete</button></td></tr>'}).join('')||'<tr><td colspan=7 class="muted">No entries yet</td></tr>')+'</table></div>'+
  '<div class="card tbl"><h2>Last 30 days</h2><table><tr><th>Date</th><th>Banner imp</th><th>Banner clicks</th><th>Full-screen imp</th><th>Clicks</th><th>Est. revenue</th><th>Reported</th></tr>'+r.series.slice().reverse().map(function(d){return '<tr><td>'+d.date+'</td><td>'+num(d.bannerImp)+'</td><td>'+num(d.bannerClk)+'</td><td>'+num(d.intImp)+'</td><td>'+num(d.intClk)+'</td><td>'+money(d.estRevenue)+'</td><td>'+money(d.reported)+'</td></tr>'}).join('')+'</table></div>';
 $('a-save').onclick=function(){WR.api('/admin/ads/config',{method:'PUT',body:{enabled:$('a-on').checked,banner:{enabled:$('b-on').checked,placementId:$('b-id').value},interstitial:{enabled:$('i-on').checked,placementId:$('i-id').value,minGapSec:+$('i-gap').value||0},ecpm:{banner:+$('e-b').value||0,interstitial:+$('e-i').value||0}}}).then(function(){toast('Settings saved',1)}).catch(fail)};
 $('r-add').onclick=function(){WR.api('/admin/ads/revenue',{method:'POST',body:{date:$('r-d').value,network:$('r-n').value,placement:$('r-p').value,amount:+$('r-a').value,impressions:+$('r-i').value||0,note:$('r-t').value}}).then(function(){toast('Added',1);ads()}).catch(fail)};
 $('csv').onclick=function(){WR.api('/admin/ads/export.csv',{raw:true}).then(function(x){return x.blob()}).then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ads-report.csv';a.click()}).catch(fail)};
 $('pane').onclick=function(e){var b=e.target.closest('button[data-del]');if(!b||!confirm('Delete this revenue entry?'))return;WR.api('/admin/ads/revenue/'+b.dataset.del,{method:'DELETE'}).then(function(){ads()}).catch(fail)}}).catch(fail)}
function scores(){WR.api('/admin/scores').then(function(r){$('pane').innerHTML='<div class="card tbl"><h2>Top 200 runs <span class="muted">(delete suspicious scores)</span></h2><table><tr><th>#</th><th>Player</th><th>E-mail</th><th>Country</th><th>Score</th><th>Distance</th><th>Clovers</th><th>Time</th><th>When</th><th></th></tr>'+
 r.scores.map(function(s,i){return '<tr><td>'+(i+1)+'</td><td>'+E(s.name)+'</td><td>'+E(s.email||'')+'</td><td>'+WR.flag(s.country)+'</td><td><b>'+num(s.score)+'</b></td><td>'+num(s.distance)+' m</td><td>'+s.clovers+'</td><td>'+s.duration+'s</td><td>'+new Date(s.created_at).toLocaleString()+'</td><td><button class="btn sm red" data-s="'+s.id+'">Delete</button></td></tr>'}).join('')+'</table></div>';
 $('pane').onclick=function(e){var b=e.target.closest('button[data-s]');if(!b||!confirm('Delete this score?'))return;WR.api('/admin/scores/'+b.dataset.s,{method:'DELETE'}).then(function(){scores()}).catch(fail)}}).catch(fail)}
if(!WR.configured()){$('login').style.display='block';$('lmsg').className='msg err';$('lmsg').textContent='Server is not connected to Supabase yet.';return}
if(WR.hasStoredSession())auth();else $('login').style.display='block';
})();
</script></body></html>
